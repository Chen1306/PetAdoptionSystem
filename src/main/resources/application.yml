server:
  port: 8080

spring:
  application:
    name: pet-adopt-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/db_pet_manage_adopt?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:123456}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

spring.servlet.multipart:
  max-file-size: 5MB
  max-request-size: 10MB

jwt:
  secret: PetAdoptJwtSecretKey2026!@#$JWT_SECRET
  expiration: 86400000

logging:
  level:
    com.petadopt.mapper: debug
